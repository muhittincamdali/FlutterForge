name: forge_example
description: "The FlutterForge example app: a todo list read from a JSON API."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_forge:
    path: ..
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
