name: flutter_forge
description: >-
  An HTTP client for Flutter and Dart apps (retries, caching, bearer tokens,
  size limits) and a `forge` command that creates a feature-first Flutter app
  wired to it.
version: 2.0.0
homepage: https://github.com/muhittincamdali/FlutterForge
repository: https://github.com/muhittincamdali/FlutterForge
issue_tracker: https://github.com/muhittincamdali/FlutterForge/issues
documentation: https://muhittincamdali.github.io/FlutterForge/
publish_to: none
topics:
  - http
  - networking
  - scaffolding
  - cli
  - riverpod

environment:
  sdk: ^3.12.0

executables:
  forge: forge

dependencies:
  args: ^2.7.0
  http: ^1.6.0
  http_parser: ^4.1.2
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
