include: package:lints/recommended.yaml

analyzer:
  exclude:
    - example/**
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - discarded_futures
    - only_throw_errors
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_constructors_first
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_statements

formatter:
  page_width: 120
